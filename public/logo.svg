<svg viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft realistic drop shadows matching Final Logo -->
    <filter id="logo-drop-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="3" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.18" />
    </filter>
    <filter id="layer-shadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="2" dy="5" stdDeviation="6" flood-color="#000000" flood-opacity="0.22" />
    </filter>
    <linearGradient id="blue-primary" x1="230" y1="230" x2="760" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2F80ED" />
      <stop offset="100%" stop-color="#1D6FE5" />
    </linearGradient>
  </defs>

  <!-- 1. Right White Pillar -->
  <path
    d="M 546 470 L 546 620 C 546 705 586 755 648 755 L 648 368 Z"
    fill="#FFFFFF"
    filter="url(#logo-drop-shadow)"
  />

  <!-- 2. Fin 3: Bottom-Left Blue Triangle -->
  <path
    d="M 260 675 L 383 590 L 383 755 Z"
    fill="#2563EB"
    filter="url(#logo-drop-shadow)"
  />

  <!-- 3. Fin 2: Middle White Chevron -->
  <path
    d="M 260 644 L 383 560 L 328 608 L 383 672 Z"
    fill="#FFFFFF"
    filter="url(#layer-shadow)"
  />

  <!-- 4. Top Blue M-Wings & Fin 1 -->
  <path
    d="M 760 230 L 458 595 L 383 503 L 383 560 L 260 465 L 315 415 L 230 295 L 450 405 Z"
    fill="url(#blue-primary)"
    filter="url(#layer-shadow)"
  />
</svg>